<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pūkuotukai – augintinių priežiūra</title>
<style>
:root{--bg:#fff;--surface:#faf3f5;--text:#26121a;--muted:#7a5d66;--accent:#7b1e3a;--accent2:#a3294d;--accent-t:#fff;--line:#efdfe4;--hdr:rgba(255,255,255,.86);--shadow:0 6px 24px rgba(123,30,58,.10);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#150a0e;--surface:#21121a;--text:#f6e9ed;--muted:#c3a2ab;--accent:#d45b7e;--accent2:#e0728f;--line:#3d222b;--hdr:rgba(21,10,14,.86);--shadow:0 6px 24px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#150a0e;--surface:#21121a;--text:#f6e9ed;--muted:#c3a2ab;--accent:#d45b7e;--accent2:#e0728f;--line:#3d222b;--hdr:rgba(21,10,14,.86);--shadow:0 6px 24px rgba(0,0,0,.4);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--hdr);backdrop-filter:blur(12px)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--hdr);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:12px 18px;display:flex;justify-content:space-between;align-items:center;gap:8px}
header b{font-size:1.15rem;color:var(--accent);letter-spacing:.2px}
button{font:inherit;cursor:pointer;transition:transform .15s,box-shadow .15s,background .15s}
.btn{background:var(--accent);color:var(--accent-t);border:0;border-radius:999px;padding:10px 20px;font-weight:600;font-size:.92rem}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(123,30,58,.3);background:var(--accent2)}
.btn.ghost{background:none;color:var(--accent);border:1.5px solid var(--accent)}
.hero{background:linear-gradient(135deg,#7b1e3a 0%,#4d0f25 100%);color:#fff;padding:44px 18px 70px;text-align:center}
.hero h1{margin:0 auto 10px;max-width:640px;font-size:clamp(1.7rem,6vw,2.5rem);line-height:1.15;font-weight:800;letter-spacing:-.5px}
.hero p{margin:0 auto;max-width:520px;color:rgba(255,255,255,.82)}
.pets{font-size:1.6rem;letter-spacing:8px;margin-bottom:12px;opacity:.95}
main{max-width:960px;margin:0 auto;padding:0 18px 18px}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:-28px auto 22px;position:relative;background:var(--bg);padding:10px;border-radius:18px;box-shadow:var(--shadow);border:1px solid var(--line)}
select,input,textarea{font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--text);width:100%}
select:focus,input:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
.filters select{width:auto;flex:1 1 140px;border:0;background:var(--surface);border-radius:999px;padding:11px 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.card{border:1px solid var(--line);border-radius:20px;padding:18px;background:var(--bg);box-shadow:var(--shadow);transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-4px);box-shadow:0 14px 34px rgba(123,30,58,.18)}
.top{display:flex;gap:12px;align-items:center}
.av{width:64px;height:64px;border-radius:50%;overflow:hidden;flex:none;box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--line)}.av svg{width:100%;height:100%;display:block}
.card h3{margin:0;font-size:1.05rem}
.meta{color:var(--muted);font-size:.88rem}
.tags{margin:10px 0;display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:1.05rem}
.price{color:var(--accent);font-weight:800;font-size:1.05rem}
.stars{color:var(--accent);letter-spacing:1px}
dialog{border:0;border-radius:24px;background:var(--bg);color:var(--text);max-width:520px;width:calc(100% - 24px);padding:22px;max-height:88vh;box-shadow:0 24px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(40,10,20,.55);backdrop-filter:blur(3px)}
.rev{border-top:1px solid var(--line);padding:10px 0;font-size:.95rem}
label{display:block;margin:10px 0 4px;font-size:.85rem;color:var(--muted)}
.row{display:flex;gap:8px;margin-top:14px;justify-content:flex-end}
.authbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}.who{max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.err{color:var(--accent);font-size:.9rem;min-height:1.2em;margin:6px 0 0}header{flex-wrap:wrap}
footer{text-align:center;color:var(--muted);font-size:.85rem;padding:28px 18px}
.gallery{display:grid;grid-template-columns:1.4fr 1fr;grid-template-rows:170px 170px;gap:12px;max-width:640px;margin:28px auto 0}
.ph{position:relative;border-radius:22px;overflow:hidden;border:3px solid rgba(255,255,255,.9);box-shadow:0 4px 14px rgba(123,30,58,.25)}
.ph img{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(1.12) contrast(1.06) brightness(1.04) sepia(.12)}
.ph::after{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(123,30,58,.22),rgba(123,30,58,0) 55%,rgba(255,235,240,.12));mix-blend-mode:multiply;pointer-events:none}
.ph.big{grid-row:1/3}
footer{text-align:center;color:var(--muted);font-size:.85rem;padding:24px 18px}
</style>
</head>

const back=a.hs==="long"?`<path d="M28 50c0-24 12-30 22-30s22 6 22 30v24H28Z" fill="${a.hair}"/>`:"";
const top=`<path d="M33 44c-1-16 8-22 17-22s18 6 17 22c-4-7-10-10-17-10s-13 3-17 10Z" fill="${a.hair}"/>`+(a.hs==="bun"?`<circle cx="50" cy="20" r="7" fill="${a.hair}"/>`:"");
const beard=a.beard?`<path d="M34 50c1 14 8 20 16 20s15-6 16-20c-3 5-8 8-16 8s-13-3-16-8Z" fill="${a.hair}"/>`:"";
const t=PET[s.pets[0]]||"dog";
return `<svg viewBox="0 0 100 100" role="img" aria-label="${esc(s.name)}"><rect width="100" height="100" fill="#f6dfe6"/>${back}<path d="M12 100C12 76 30 68 50 68S88 76 88 100Z" fill="${a.shirt}"/><rect x="44" y="58" width="12" height="14" rx="5" fill="${a.skin}"/><circle cx="50" cy="46" r="17" fill="${a.skin}"/>${top}${beard}<circle cx="44" cy="46" r="1.8" fill="#2a1218"/><circle cx="56" cy="46" r="1.8" fill="#2a1218"/><path d="M45 53q5 4 10 0" stroke="${a.beard?"#fff":"#2a1218"}" stroke-width="1.6" fill="none" stroke-linecap="round"/><g transform="translate(73 76) scale(.6)">${PETS[t]}</g></svg>`;
}

// ===== 3. DUOMENŲ ĮKĖLIMAS IŠ DUOMENŲ BAZĖS =====
async function load(){
// Prašome visų anketų kartu su jų atsiliepimais (lentelės susietos per sitter_id)
const {data,error}=await sb.from("sitters").select("*, reviews(*)").order("created_at",{ascending:false});
if(error){$("grid").innerHTML="<p>Nepavyko įkelti duomenų: "+esc(error.message)+"</p>";return}
sitters=data.map(s=>({...s,reviews:(s.reviews||[]).map(r=>({n:r.author,s:r.stars,t:r.body}))}));
cities();render();
}
function cities(){const c=[...new Set(sitters.map(s=>s.city))].sort(),sel=$("fCity"),v=sel.value;
sel.innerHTML='<option value="">Visi miestai</option>'+c.map(x=>`<option>${esc(x)}</option>`).join("");sel.value=v}
function render(){
let l=sitters.filter(s=>(!$("fPet").value||s.pets.includes($("fPet").value))&&(!$("fCity").value||s.city===$("fCity").value));
l.sort($("fSort").value==="p"?(a,b)=>a.price-b.price:(a,b)=>avg(b)-avg(a));
if(!sitters.length){$("grid").innerHTML="<p>Kol kas nėra nė vienos anketos. Prisijunkite ir būkite pirmas!</p>";return}
$("grid").innerHTML=l.length?l.map(s=>`<div class="card"><div class="top"><div class="av">${avatar(s)}</div><div><h3>${esc(s.name)}</h3><div class="meta">📍 ${esc(s.city)}</div></div></div>
<div class="tags">${s.pets.map(p=>`<span class="chip">${esc(p)}</span>`).join("")}</div>
<div class="meta"><span class="stars">${star(avg(s))}</span> (${s.reviews.length})</div>
<p class="meta">${esc(s.about)}</p>
<div class="top" style="justify-content:space-between"><span class="price">${esc(String(s.price))} € / diena</span><button class="btn" onclick="openProfile('${s.id}')">Peržiūrėti</button></div></div>`).join(""):"<p>Pagal šiuos kriterijus nieko nerasta.</p>";
}

// ===== 4. PRISIJUNGIMAS / REGISTRACIJA =====
function renderAuth(){
const b=$("authbar");
if(user){b.innerHTML=`<span class="meta who">${esc(user.email)}</span><button class="btn ghost" onclick="openMyBookings()">Mano užsakymai</button><button class="btn" onclick="openAdd()">Tapti prižiūrėtoju</button><button class="btn ghost" onclick="logout()">Atsijungti</button>`}
else{b.innerHTML=`<button class="btn ghost" onclick="openAuth()">Prisijungti</button><button class="btn" onclick="openAuth()">Registruotis</button>`}
}
function openAuth(){
$("dlg").innerHTML=`<h3 style="margin-top:0">Prisijungimas</h3>
<label>El. paštas</label><input id="ae" type="email" autocomplete="email">
<label>Slaptažodis (bent 6 simboliai)</label><input id="ap2" type="password" autocomplete="current-password">
<p class="err" id="am"></p>
<div class="row"><button class="btn ghost" onclick="$('dlg').close()">Atšaukti</button><button class="btn ghost" onclick="doAuth('up')">Sukurti paskyrą</button><button class="btn" onclick="doAuth('in')">Prisijungti</button></div>`;
$("dlg").showModal();
}
function tr(m){
if(/invalid login/i.test(m))return"Neteisingas el. paštas arba slaptažodis.";
if(/already registered|already been registered/i.test(m))return"Toks el. paštas jau užregistruotas.";
if(/password/i.test(m)&&/6|short|least/i.test(m))return"Slaptažodis per trumpas (bent 6 simboliai).";
if(/email.*invalid|invalid.*email/i.test(m))return"Neteisingas el. pašto adresas.";
return m;
}
async function doAuth(kind){
const email=$("ae").value.trim(),pw=$("ap2").value,msg=$("am");
if(!email||pw.length<6){msg.textContent="Įveskite el. paštą ir bent 6 simbolių slaptažodį.";return}
msg.textContent="Palaukite…";
// signUp = nauja paskyra, signInWithPassword = prisijungimas
const r=kind==="up"?await sb.auth.signUp({email,password:pw}):await sb.auth.signInWithPassword({email,password:pw});
if(r.error){msg.textContent=tr(r.error.message);return}
if(kind==="up"&&!r.data.session){msg.textContent="Paskyra sukurta. Patvirtinkite el. paštą (išsiuntėme laišką) ir prisijunkite.";return}
$("dlg").close();
}
async function logout(){await sb.auth.signOut()}
// Kai prisijungiama ar atsijungiama, atnaujiname viršutinę juostą
sb.auth.onAuthStateChange((_e,session)=>{user=session?session.user:null;renderAuth()});

// ===== 5. PROFILIS IR ATSILIEPIMAI =====
function openProfile(id){
const s=sitters.find(x=>x.id===id);if(!s)return;
const mine=user&&s.user_id===user.id;
$("dlg").innerHTML=`<div class="top"><div class="av">${avatar(s)}</div><div><h3 style="margin:0">${esc(s.name)}</h3><div class="meta">📍 ${esc(s.city)} · ${esc(String(s.price))} € / diena</div></div></div>
<p>${esc(s.about)}</p><div class="tags">${s.pets.map(p=>`<span class="chip">${esc(p)}</span>`).join("")}</div>
${bookingBlock(s,mine)}${user?'<div id="rq"></div>':""}
<h4>Atsiliepimai (${s.reviews.length})</h4>
${s.reviews.map(r=>`<div class="rev"><span class="stars">${star(r.s)}</span> <b>${esc(r.n)}</b><br>${esc(r.t)}</div>`).join("")||'<p class="meta">Atsiliepimų dar nėra.</p>'}
${user&&!mine?`<div id="rf"><p class="meta">Atsiliepimą gali palikti tik tas, kurio užsakymas priimtas.</p><div class="row"><button class="btn ghost" onclick="$('dlg').close()">Uždaryti</button></div></div>`
:user?`<div class="row"><button class="btn ghost" onclick="$('dlg').close()">Uždaryti</button></div>`:`<p class="meta">Norėdami palikti atsiliepimą, prisijunkite.</p><div class="row"><button class="btn ghost" onclick="$('dlg').close()">Uždaryti</button><button class="btn" onclick="openAuth()">Prisijungti</button></div>`}
${mine?`<div class="row"><button class="btn ghost" onclick="delSitter('${s.id}')">Ištrinti mano anketą</button></div>`:""}`;
$("dlg").showModal();
if(user)loadRequests(s.id,mine);
}
async function addRev(id){
const n=$("rn").value.trim(),t=$("rt").value.trim();
if(!n||!t){$("rm").textContent="Užpildykite vardą ir tekstą.";return}
// Į duomenų bazę rašome tik jei RLS taisyklė leidžia (prisijungęs, user_id sutampa)
const {error}=await sb.from("reviews").insert({sitter_id:id,user_id:user.id,author:n,stars:+$("rs").value,body:t});
if(error){$("rm").textContent="Nepavyko: "+error.message;return}
await load();openProfile(id);
}

// ===== 5b. UŽSAKYMAI =====
// Šiandienos data formatu YYYY-MM-DD (pagal kompiuterio laiką), kad nebūtų galima rinktis praeities datų
function todayStr(){return new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10)}

// Užsakymo formos vieta profilio lange: priklauso nuo to, kas žiūri
function bookingBlock(s,mine){
if(mine)return"";  // savo anketos užsakyti negalima
if(!user)return'<p class="meta">Norėdami užsakyti paslaugą, prisijunkite.</p>';
return`<div id="bk"><h4>Užsakyti paslaugą</h4>
<label>Jūsų vardas</label><input id="bo" maxlength="30">
<label>Kontaktas (telefonas arba el. paštas)</label><input id="bc" maxlength="60">
<label>Nuo</label><input id="bs" type="date" min="${todayStr()}">
<label>Iki</label><input id="be" type="date" min="${todayStr()}">
<textarea id="bn" rows="2" placeholder="Pastaba (gyvūno vardas, ypatumai)" style="margin-top:6px" maxlength="300"></textarea>
<p class="err" id="bm"></p>
<div class="row"><button class="btn" onclick="addBooking('${s.id}')">Pateikti užsakymą</button></div></div>`;
}

async function addBooking(id){
const s=sitters.find(x=>x.id===id);
const a=$("bs").value,b=$("be").value,n=$("bn").value.trim(),o=$("bo").value.trim(),c=$("bc").value.trim();
if(!o||!c){$("bm").textContent="Įrašykite savo vardą ir kontaktą.";return}
if(!a||!b){$("bm").textContent="Pasirinkite abi datas.";return}
if(a<todayStr()){$("bm").textContent="Pradžios data negali būti praeityje.";return}
if(b<a){$("bm").textContent="Pabaigos data negali būti ankstesnė už pradžią.";return}
// owner_id duomenų bazė įrašo pati (auth.uid()), todėl jo nesiunčiame; statusas pradžioje visada "pending"
const {error}=await sb.from("bookings").insert({sitter_id:id,start_date:a,end_date:b,note:n||null,owner_name:o,owner_contact:c});
if(error){$("bm").textContent="Nepavyko: "+error.message;return}
const days=Math.round((new Date(b)-new Date(a))/86400000)+1;
$("bk").innerHTML=`<h4>Užklausa išsiųsta</h4><p class="meta">${esc(s.name)} gaus jūsų užklausą ${esc(a)} – ${esc(b)}. Preliminari kaina: <b>${days*s.price} €</b> (${days} d. × ${esc(String(s.price))} €).</p>`;
}

// Užklausų sąrašas profilio lange. Ką matyti leidžiama, nusprendžia duomenų bazės taisyklės (RLS):
// prižiūrėtojas mato visas savo anketos užklausas, kitas prisijungęs žmogus tik savo paties.
async function loadRequests(id,mine){
const box=$("rq");if(!box)return;
const {data,error}=await sb.from("bookings").select("*").eq("sitter_id",id).order("created_at",{ascending:false});
if(error){box.innerHTML='<p class="err">Nepavyko įkelti užklausų: '+esc(error.message)+'</p>';return}
if(!mine){const rf=$("rf");if(rf&&data.some(r=>r.status==="accepted"))rf.innerHTML=reviewForm(id)}
if(!data.length){box.innerHTML=mine?'<h4>Gautos užklausos</h4><p class="meta">Užklausų dar nėra.</p>':"";return}
const L={pending:"Laukia atsakymo",accepted:"Priimta",declined:"Atmesta"};
box.innerHTML=`<h4>${mine?"Gautos užklausos":"Jūsų užklausos"}</h4>`+data.map(r=>`<div class="rev"><b>${esc(r.owner_name||"Užsakovas")}</b> · ${esc(r.start_date)} – ${esc(r.end_date)}<br><b>${L[r.status]||esc(r.status)}</b>${r.note?`<br>${esc(r.note)}`:""}${mine&&r.owner_contact?`<br>Kontaktas: ${esc(r.owner_contact)}`:""}${mine&&r.status==="pending"?`<div class="row"><button class="btn ghost" onclick="setStatus('${r.id}','declined','${id}')">Atmesti</button><button class="btn" onclick="setStatus('${r.id}','accepted','${id}')">Priimti</button></div>`:""}</div>`).join("");
}
async function setStatus(bid,status,sid){
const {error}=await sb.from("bookings").update({status}).eq("id",bid);
if(error){alert("Nepavyko: "+error.message);return}
if($("rq"))loadRequests(sid,true);else openMyBookings();
}

// "Mano užsakymai": vienas langas su visu, ką šiai paskyrai leidžia matyti duomenų bazė (RLS):
// užsakymai, kuriuos pateikė pats žmogus, ir užklausos, gautos į jo anketas.
async function openMyBookings(){
$("dlg").innerHTML='<h3 style="margin:0">Mano užsakymai</h3><p class="meta">Kraunama…</p>';
if(!$("dlg").open)$("dlg").showModal();
const {data,error}=await sb.from("bookings").select("*").order("created_at",{ascending:false});
if(error){$("dlg").innerHTML='<h3 style="margin:0">Mano užsakymai</h3><p class="err">Nepavyko įkelti: '+esc(error.message)+'</p><div class="row"><button class="btn ghost" onclick="$(\'dlg\').close()">Uždaryti</button></div>';return}
const L={pending:"Laukia atsakymo",accepted:"Priimta",declined:"Atmesta"};
const nm=id=>{const s=sitters.find(x=>x.id===id);return s?s.name:"Anketa"};
const row=(r,inc)=>`<div class="rev"><b>${esc(inc?(r.owner_name||"Užsakovas"):nm(r.sitter_id))}</b> · ${esc(r.start_date)} – ${esc(r.end_date)}<br><b>${L[r.status]||esc(r.status)}</b>${r.note?`<br>${esc(r.note)}`:""}${inc&&r.owner_contact?`<br>Kontaktas: ${esc(r.owner_contact)}`:""}${inc&&r.status==="pending"?`<div class="row"><button class="btn ghost" onclick="setStatus('${r.id}','declined','${r.sitter_id}')">Atmesti</button><button class="btn" onclick="setStatus('${r.id}','accepted','${r.sitter_id}')">Priimti</button></div>`:""}</div>`;
const out=data.filter(r=>r.owner_id===user.id),inc=data.filter(r=>r.owner_id!==user.id);
$("dlg").innerHTML=`<h3 style="margin:0">Mano užsakymai</h3>
<h4>Mano pateiktos užklausos</h4>${out.map(r=>row(r,false)).join("")||'<p class="meta">Dar nieko neužsakėte.</p>'}
${inc.length?`<h4>Gautos užklausos</h4>${inc.map(r=>row(r,true)).join("")}`:""}
<div class="row"><button class="btn ghost" onclick="$('dlg').close()">Uždaryti</button></div>`;
}

// Atsiliepimo forma: rodoma tik jei šiai anketai turite PRIIMTĄ užsakymą (tą pačią taisyklę užtikrina ir duomenų bazė)
function reviewForm(id){
return`<label>Palikti atsiliepimą</label>
<input id="rn" placeholder="Jūsų vardas" maxlength="30">
<select id="rs" style="margin-top:6px"><option value="5">★★★★★</option><option value="4">★★★★☆</option><option value="3">★★★☆☆</option><option value="2">★★☆☆☆</option><option value="1">★☆☆☆☆</option></select>
<textarea id="rt" rows="2" placeholder="Kaip sekėsi?" style="margin-top:6px" maxlength="300"></textarea>
<p class="err" id="rm"></p>
<div class="row"><button class="btn ghost" onclick="$('dlg').close()">Uždaryti</button><button class="btn" onclick="addRev('${id}')">Pateikti</button></div>`;
}

// ===== 6. NAUJA ANKETA =====
function openAdd(){
if(!user){openAuth();return}
$("dlg").innerHTML=`<h3 style="margin-top:0">Tapti prižiūrėtoju</h3>
<label>Vardas</label><input id="an" maxlength="30">
<label>Miestas</label><input id="ac" maxlength="30">
<label>Kaina už dieną (€)</label><input id="ap" type="number" min="1" value="10">
<label>Gyvūnai, kuriuos prižiūri</label>
<div class="tags"><label style="display:inline"><input type="checkbox" class="ak" value="🐶" style="width:auto"> 🐶</label> <label style="display:inline"><input type="checkbox" class="ak" value="🐱" style="width:auto"> 🐱</label> <label style="display:inline"><input type="checkbox" class="ak" value="🐰" style="width:auto"> 🐰</label> <label style="display:inline"><input type="checkbox" class="ak" value="🐦" style="width:auto"> 🐦</label></div>
<label>Apie jus (CV, patirtis)</label><textarea id="aa" rows="3" maxlength="400"></textarea>
<p class="err" id="sm"></p>
<div class="row"><button class="btn ghost" onclick="$('dlg').close()">Atšaukti</button><button class="btn" onclick="addSitter()">Paskelbti</button></div>`;
$("dlg").showModal();
}
async function addSitter(){
const n=$("an").value.trim(),c=$("ac").value.trim(),a=$("aa").value.trim(),p=[...document.querySelectorAll(".ak:checked")].map(x=>x.value);
if(!n||!c||!a||!p.length){$("sm").textContent="Užpildykite visus laukus ir pasirinkite bent vieną gyvūną.";return}
const {error}=await sb.from("sitters").insert({user_id:user.id,name:n,city:c,pets:p,price:+$("ap").value||10,about:a});
if(error){$("sm").textContent="Nepavyko: "+error.message;return}
$("dlg").close();await load();
}
async function delSitter(id){
if(!confirm("Ištrinti šią anketą?"))return;
const {error}=await sb.from("sitters").delete().eq("id",id);
if(error){alert("Nepavyko: "+error.message);return}
$("dlg").close();await load();
}

// ===== 7. PRADŽIA =====
$("grid").innerHTML="<p>Kraunama…</p>";
renderAuth();
load();
</script>
</body>
</html>
